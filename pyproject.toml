[tool.black]
line-length = "110"
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.venv
    | venv
    | venv2
    | _build
    | build
    | dist
    | plugins
    | temp
  )/
)
'''

[tool.poetry]
name = 'Supportly'
version = '4.2.1'
description = "Supportly is a feature-rich Discord support bot. Users DM the bot to contact your staff team through a shared inbox."
license = 'AGPL-3.0-only'
authors = [
    'Supportly <supportly@example.com>'
]
readme = 'README.md'
keywords = ['discord', 'supportly', 'support']

[tool.pylint.format]
max-line-length = "110"
