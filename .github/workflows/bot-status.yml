name: bot-status

on:
  # GitHub Actions minimum granularity is 5 minutes for cron.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Query Discord for the bot's presence
        id: discord
        env:
          TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          # Guild (Froggy): 1523251076915265606
          # Bot user id:    1434002643642220616
          # (Discord requires a User-Agent on every API call.)
          code=$(curl -sS \
            -H "User-Agent: SupportlyStatus (https://github.com/justsadnyx-ux/supportly)" \
            -H "Authorization: Bot $TOKEN" \
            "https://discord.com/api/v10/guilds/1523251076915265606/members/1434002643642220616" \
            -o member.json -w "%{http_code}")
          echo "HTTP=$code size=$(wc -c < member.json) bytes"
          export CURL_CODE="$code"
          python3 - <<'PY'
          import json, os, datetime
          code = os.environ.get("CURL_CODE", "")
          online = False
          status = "offline"
          activity = ""
          raw = open("member.json").read()
          try:
              m = json.loads(raw)
          except Exception:
              m = None
          if isinstance(m, dict) and m.get("user"):
              p = m.get("presence") or {}
              s = p.get("status")
              acts = p.get("activities") or []
              if s and s != "offline":
                  online = True
                  status = s
              elif s is None and not acts:
                  status = "presence unavailable (Presence Intent not enabled on the dev portal)"
              if acts:
                  a = acts[0]
                  activity = a.get("state") or a.get("name") or ""
          elif isinstance(m, dict) and m.get("message"):
              status = "discord error: " + str(m.get("message")) + " (code " + str(m.get("code")) + ")"
          else:
              status = "discord error: HTTP " + (code or "?") + " - " + (raw[:120] or "no body")
          out = {
              "online": online,
              "status": status,
              "activity": activity,
              "checked_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          json.dump(out, open("docs/status.json", "w"), indent=2)
          print("status:", out["status"], "| online:", out["online"], "| activity:", out["activity"])
          PY

      - name: Commit status.json
        if: steps.discord.outcome == 'success'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/status.json
          git diff --staged --quiet || (git commit -m "docs: refresh bot status" && git push)
